server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Serve Setup script at root with correct Content-Type for curl/bash
    location = / {
        default_type text/plain;
        charset utf-8;
        try_files /Setup =404;
    }

    # Also serve at /Setup path
    location = /Setup {
        default_type text/plain;
        charset utf-8;
    }

    # Serve SetupOrion binary
    location = /SetupOrion {
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="SetupOrion"';
    }
}
